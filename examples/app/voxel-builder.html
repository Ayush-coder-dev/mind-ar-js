<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Voxel Builder Challenge</title>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #111;
            overflow: hidden;
            touch-action: none;
        }

        #video {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
        }

        #gridCanvas,
        #handCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
        }

        #gridCanvas {
            z-index: 2;
        }

        #handCanvas {
            z-index: 5;
        }

        #cubesLayer {
            position: fixed;
            inset: 0;
            z-index: 4;
            pointer-events: none;
            perspective: 800px;
        }

        /* UI Overlays */
        .ui-top {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0 24px;
            pointer-events: none;
        }

        .back-btn {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 20px;
            color: white;
            text-decoration: none;
            backdrop-filter: blur(5px);
            font-weight: 600;
            pointer-events: auto;
        }

        .level-info {
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 25px;
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(5px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .level-title {
            font-size: 14px;
            text-transform: uppercase;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        .curr-level {
            font-size: 24px;
            font-weight: 800;
            color: #fbbf24;
        }

        .timer-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 25px;
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(5px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .timer-val {
            font-size: 28px;
            font-weight: 700;
            font-family: monospace;
        }

        .timer-val.urgent {
            color: #ef4444;
            animation: pulse 0.5s infinite;
        }

        .progress-bar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            background: rgba(255, 255, 255, 0.1);
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            z-index: 100;
        }

        .progress-fill {
            height: 100%;
            background: #22c55e;
            width: 0%;
            transition: width 0.3s ease;
        }

        .hand-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 900;
            transform: translate(-50%, -50%);
            transition: all 0.1s ease;
        }

        .hand-cursor.drawing {
            background: #fbbf24;
            border-color: #fbbf24;
            box-shadow: 0 0 15px #fbbf24;
        }

        /* Cubes */
        .grid-cube,
        .ghost-cube {
            position: absolute;
            transform-style: preserve-3d;
        }

        .grid-cube {
            animation: cubeAppear 0.2s ease;
        }

        .grid-cube .face {
            position: absolute;
            border: 1px solid rgba(0, 0, 0, 0.1);
            opacity: 0.9;
        }

        /* User Cube Colors (Gold/Construction) */
        .grid-cube .front {
            background: #d97706;
            transform: translateZ(var(--half-size));
        }

        .grid-cube .back {
            background: #b45309;
            transform: rotateY(180deg) translateZ(var(--half-size));
        }

        .grid-cube .top {
            background: #fbbf24;
            transform: rotateX(90deg) translateZ(var(--half-size));
        }

        .grid-cube .bottom {
            background: #92400e;
            transform: rotateX(-90deg) translateZ(var(--half-size));
        }

        .grid-cube .left {
            background: #d97706;
            transform: rotateY(-90deg) translateZ(var(--half-size));
        }

        .grid-cube .right {
            background: #d97706;
            transform: rotateY(90deg) translateZ(var(--half-size));
        }

        /* Ghost Cube (Blueprint) */
        .ghost-cube .face {
            position: absolute;
            border: 2px dashed rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .ghost-cube .front {
            transform: translateZ(var(--half-size));
        }

        .ghost-cube .back {
            transform: rotateY(180deg) translateZ(var(--half-size));
        }

        .ghost-cube .top {
            transform: rotateX(90deg) translateZ(var(--half-size));
        }

        .ghost-cube .bottom {
            transform: rotateX(-90deg) translateZ(var(--half-size));
        }

        .ghost-cube .left {
            transform: rotateY(-90deg) translateZ(var(--half-size));
        }

        .ghost-cube .right {
            transform: rotateY(90deg) translateZ(var(--half-size));
        }

        .ghost-cube.filled .face {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.2);
        }

        @keyframes cubeAppear {
            from {
                transform: scale(0);
            }

            to {
                transform: scale(1);
            }
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }
        }

        /* Overlays */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            pointer-events: auto;
        }

        .btn {
            background: #fbbf24;
            color: black;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 20px;
        }

        .btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <video id="video" playsinline></video>
    <canvas id="gridCanvas"></canvas>
    <canvas id="handCanvas"></canvas>
    <div id="cubesLayer"></div>
    <div id="handCursor" class="hand-cursor" style="display:none"></div>

    <div class="ui-top">
        <a href="index.html" class="back-btn">← Exit</a>

        <div class="level-info">
            <div class="level-title">Level</div>
            <div class="curr-level" id="levelDisp">1</div>
        </div>

        <div class="timer-box">
            <div class="level-title">Time</div>
            <div class="timer-val" id="timerDisp">60</div>
        </div>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="overlay" id="startScreen">
        <h1 style="color:#fbbf24; font-size:48px; margin-bottom:10px;">Voxel Builder</h1>
        <p style="color:white; text-align:center; max-width:400px; line-height:1.5;">
            You are the builder!<br>
            Fill the <b>GHOST BLOCKS</b> with your own blocks.<br>
            Use <b>Thumb+Index Pinch</b> to place a block.
        </p>
        <button class="btn" onclick="startGame()">Start Building</button>
    </div>

    <div class="overlay" id="winScreen" style="display:none">
        <h1 style="color:#22c55e; font-size:48px;">Level Complete!</h1>
        <p style="color:white;">Great job!</p>
        <button class="btn" onclick="nextLevel()">Next Level</button>
    </div>

    <div class="overlay" id="loseScreen" style="display:none">
        <h1 style="color:#ef4444; font-size:48px;">Time's Up!</h1>
        <p style="color:white;">Incomplete structure.</p>
        <button class="btn" onclick="restartLevel()">Try Again</button>
    </div>

    <script>
        // Constants & Config
        const GRID_SIZE = 40;
        const PINCH_THRESHOLD = 0.05;
        const PINCH_HOLD_FRAMES = 3;

        // Elements
        const video = document.getElementById('video');
        const gridCanvas = document.getElementById('gridCanvas');
        const handCanvas = document.getElementById('handCanvas');
        const cubesLayer = document.getElementById('cubesLayer');
        const handCursor = document.getElementById('handCursor');
        const levelDisp = document.getElementById('levelDisp');
        const timerDisp = document.getElementById('timerDisp');
        const progressFill = document.getElementById('progressFill');
        const startScreen = document.getElementById('startScreen');
        const winScreen = document.getElementById('winScreen');
        const loseScreen = document.getElementById('loseScreen');

        const gridCtx = gridCanvas.getContext('2d');
        const handCtx = handCanvas.getContext('2d');

        // State
        let currentLevel = 1;
        let timeRemaining = 60;
        let timerInterval = null;
        let isGameActive = false;

        let handX = 0, handY = 0;
        let drawFrames = 0;
        let lastGridCell = null;

        let placedCubes = new Set(); // Stores "x,y" keys
        let ghostCubes = []; // Array of {x, y, element}

        // Levels Data (Blueprint coordinates relative to center)
        const levels = [
            [ // Level 1: 2x2 Square
                { x: 0, y: 0 }, { x: 1, y: 0 },
                { x: 0, y: 1 }, { x: 1, y: 1 }
            ],
            [ // Level 2: Line
                { x: -2, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 0 }, { x: 1, y: 0 }, { x: 2, y: 0 }
            ],
            [ // Level 3: Cross
                { x: 0, y: 0 },
                { x: -1, y: 0 }, { x: 1, y: 0 },
                { x: 0, y: -1 }, { x: 0, y: 1 }
            ],
            [ // Level 4: Frame
                { x: -1, y: -1 }, { x: 0, y: -1 }, { x: 1, y: -1 },
                { x: -1, y: 0 }, { x: 1, y: 0 },
                { x: -1, y: 1 }, { x: 0, y: 1 }, { x: 1, y: 1 }
            ]
        ];

        // Setup
        function resize() {
            gridCanvas.width = handCanvas.width = window.innerWidth;
            gridCanvas.height = handCanvas.height = window.innerHeight;
            renderGhostCubes(); // Re-center on resize
        }
        window.addEventListener('resize', resize);
        resize();

        // Game Logic
        function startGame() {
            startScreen.style.display = 'none';
            currentLevel = 1;
            loadLevel(currentLevel);
        }

        function nextLevel() {
            winScreen.style.display = 'none';
            currentLevel++;
            if (currentLevel > levels.length) currentLevel = 1; // Loop or end
            loadLevel(currentLevel);
        }

        function restartLevel() {
            loseScreen.style.display = 'none';
            loadLevel(currentLevel);
        }

        function loadLevel(lvl) {
            levelDisp.textContent = lvl;
            timeRemaining = 30 + (lvl * 10); // More time for harder levels
            timerDisp.textContent = timeRemaining;
            timerDisp.className = 'timer-val';

            // Clear board
            cubesLayer.innerHTML = '';
            placedCubes.clear();
            ghostCubes = [];

            // Build Blueprints
            const centerX = Math.floor(window.innerWidth / GRID_SIZE / 2);
            const centerY = Math.floor(window.innerHeight / GRID_SIZE / 2);

            const layout = levels[lvl - 1];
            layout.forEach(pos => {
                // Ghost coords
                const gx = centerX + pos.x;
                const gy = centerY + pos.y;
                createCube(gx, gy, 'ghost-cube');
                ghostCubes.push({ x: gx, y: gy, filled: false });
            });

            isGameActive = true;
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);
            updateProgress();
        }

        function updateTimer() {
            if (!isGameActive) return;
            timeRemaining--;
            timerDisp.textContent = timeRemaining;
            if (timeRemaining <= 10) timerDisp.classList.add('urgent');

            if (timeRemaining <= 0) {
                isGameActive = false;
                clearInterval(timerInterval);
                loseScreen.style.display = 'flex';
            }
        }

        function createCube(cellX, cellY, type = 'grid-cube') {
            const size = GRID_SIZE - 2;
            const halfSize = size / 2;
            const cube = document.createElement('div');
            cube.className = type;
            cube.style.cssText = `left:${cellX * GRID_SIZE + 1}px;top:${cellY * GRID_SIZE + 1}px;width:${size}px;height:${size}px;--half-size:${halfSize}px`;

            ['front', 'back', 'top', 'bottom', 'left', 'right'].forEach(f => {
                const face = document.createElement('div');
                face.className = `face ${f}`;
                face.style.cssText = `width:${size}px;height:${size}px`;
                cube.appendChild(face);
            });

            cubesLayer.appendChild(cube);

            // Keep reference if ghost
            if (type === 'ghost-cube') {
                const idx = ghostCubes.length; // Will be pushed after return in loadLevel loop, but we need element ref... 
                // Wait, logic in loadLevel handles push. We just return here?
                // Actually better to store element reference in ghostCubes
                // We'll fix ghostCubes structure in loadLevel
                cube.dataset.gx = cellX;
                cube.dataset.gy = cellY;
            }
            return cube;
        }

        // Need to override renderGhostCubes to actually store elements
        // Let's refactor createCube to be simpler helper

        function renderGhostCubes() {
            // Only if game active? No, on resize.
            // Actually, resizing breaks absolute positions. 
            // Ideally we clear and rebuild, but state preservation is tricky.
            // For now, assume fixed window or restart on resize for simplicity
        }

        function checkClick(cx, cy) {
            const key = `${cx},${cy}`;
            if (placedCubes.has(key)) return; // Already there

            // Create User Cube
            createCube(cx, cy, 'grid-cube');
            placedCubes.add(key);

            checkWinCondition();
        }

        function checkWinCondition() {
            // Check if every ghost cube has a matching user cube
            let filledCount = 0;
            const total = ghostCubes.length;

            // Visual Update
            const ghosts = document.querySelectorAll('.ghost-cube');
            ghosts.forEach(g => {
                const gx = parseInt(g.dataset.gx);
                const gy = parseInt(g.dataset.gy);
                const key = `${gx},${gy}`;
                if (placedCubes.has(key)) {
                    g.classList.add('filled');
                    filledCount++;
                } else {
                    g.classList.remove('filled');
                }
            });

            // Progress Bar
            const pct = (filledCount / total) * 100;
            progressFill.style.width = pct + '%';

            if (filledCount === total) {
                // WIN!
                isGameActive = false;
                clearInterval(timerInterval);
                setTimeout(() => {
                    winScreen.style.display = 'flex';
                }, 500);
            }
        }

        function getGridCell(x, y) {
            return {
                cellX: Math.floor(x / GRID_SIZE),
                cellY: Math.floor(y / GRID_SIZE),
                key: `${Math.floor(x / GRID_SIZE)},${Math.floor(y / GRID_SIZE)}`
            };
        }

        function updateProgress() {
            checkWinCondition();
        }

        // Hand Tracking
        function onResults(results) {
            handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const lm = results.multiHandLandmarks[0];
                drawConnectors(handCtx, lm, HAND_CONNECTIONS, { color: 'rgba(251, 191, 36, 0.5)', lineWidth: 2 });
                drawLandmarks(handCtx, lm, { color: '#fbbf24', lineWidth: 1, radius: 2 });

                // Cursor Pos
                handX = ((1 - lm[8].x) * window.innerWidth); // Mirror
                handY = (lm[8].y * window.innerHeight);

                handCursor.style.display = 'block';
                handCursor.style.left = handX + 'px';
                handCursor.style.top = handY + 'px';

                // Detect Pinch (Index+Thumb)
                const dx = lm[4].x - lm[8].x;
                const dy = lm[4].y - lm[8].y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < PINCH_THRESHOLD) {
                    drawFrames++;
                } else {
                    drawFrames = 0;
                    handCursor.classList.remove('drawing');
                }

                if (drawFrames > PINCH_HOLD_FRAMES && isGameActive) {
                    handCursor.classList.add('drawing');
                    const cell = getGridCell(handX, handY);
                    if (cell.key !== lastGridCell) {
                        checkClick(cell.cellX, cell.cellY);
                        lastGridCell = cell.key;
                    }
                } else {
                    lastGridCell = null;
                }
            } else {
                handCursor.style.display = 'none';
            }
        }

        const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.5 });
        hands.onResults(onResults);

        const camera = new Camera(video, {
            onFrame: async () => { await hands.send({ image: video }); },
            width: 1280, height: 720
        });
        camera.start();

        // Draw initial grid
        function drawGrid() {
            gridCtx.strokeStyle = 'rgba(255,255,255,0.05)';
            for (let x = 0; x < gridCanvas.width; x += GRID_SIZE) {
                gridCtx.beginPath(); gridCtx.moveTo(x, 0); gridCtx.lineTo(x, gridCanvas.height); gridCtx.stroke();
            }
            for (let y = 0; y < gridCanvas.height; y += GRID_SIZE) {
                gridCtx.beginPath(); gridCtx.moveTo(0, y); gridCtx.lineTo(gridCanvas.width, y); gridCtx.stroke();
            }
        }
        drawGrid();

    </script>
</body>

</html>
