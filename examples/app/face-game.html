<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Fruit Catcher - AR Game</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* ========== BACK BUTTON ========== */
        .back-btn {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        /* ========== GAME UI ========== */
        .game-ui {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
        }

        .score-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 12px 20px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 20px;
            min-width: 100px;
            text-align: center;
            color: white;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        }

        .combo-display {
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 14px;
            color: #4facfe;
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.3s ease;
        }

        .combo-display.visible {
            opacity: 1;
            transform: scale(1);
        }

        .timer-display {
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 14px;
            color: white;
            backdrop-filter: blur(10px);
        }

        /* ========== MOUTH INDICATOR ========== */
        .mouth-indicator {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            color: white;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .mouth-indicator.open {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 8px 24px rgba(79, 172, 254, 0.4);
        }

        .mouth-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4757;
            transition: all 0.2s ease;
        }

        .mouth-indicator.open .mouth-dot {
            background: white;
        }

        /* ========== FRUITS ========== */
        .fruit {
            position: fixed;
            font-size: 48px;
            z-index: 500;
            transition: transform 0.1s ease;
            pointer-events: none;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
        }

        .fruit.caught {
            animation: catchBurst 0.4s ease forwards;
        }

        .fruit.missed {
            animation: missShake 0.3s ease forwards;
        }

        @keyframes catchBurst {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.5);
                opacity: 0.8;
            }

            100% {
                transform: scale(0);
                opacity: 0;
            }
        }

        @keyframes missShake {

            0%,
            100% {
                transform: translateX(0);
                opacity: 1;
            }

            25% {
                transform: translateX(-10px);
            }

            75% {
                transform: translateX(10px);
            }

            100% {
                opacity: 0;
            }
        }

        /* ========== CATCH ZONE ========== */
        .catch-zone {
            position: fixed;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 80px;
            border: 3px dashed rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            z-index: 400;
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .catch-zone.active {
            border-color: #4facfe;
            background: rgba(79, 172, 254, 0.2);
            box-shadow: 0 0 30px rgba(79, 172, 254, 0.5);
        }

        /* ========== START SCREEN ========== */
        .start-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            padding: 40px;
        }

        .start-screen.hidden {
            display: none;
        }

        .start-title {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .start-icon {
            font-size: 80px;
            margin-bottom: 24px;
        }

        .start-desc {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            max-width: 280px;
            line-height: 1.5;
            margin-bottom: 40px;
        }

        .start-btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 16px 48px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(79, 172, 254, 0.4);
            transition: all 0.3s ease;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(79, 172, 254, 0.5);
        }

        /* ========== GAME OVER ========== */
        .game-over {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            padding: 40px;
        }

        .game-over.visible {
            display: flex;
        }

        .game-over-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .final-score {
            font-size: 64px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .high-score {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 40px;
        }

        .play-again-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 16px;
        }

        .back-home-btn {
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 32px;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
        }

        /* ========== SCORE POPUP ========== */
        .score-popup {
            position: fixed;
            font-size: 24px;
            font-weight: 700;
            color: #4facfe;
            z-index: 1500;
            pointer-events: none;
            animation: popUp 0.6s ease forwards;
        }

        @keyframes popUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }

            100% {
                transform: translateY(-60px) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <!-- Back Button -->
    <a href="./index.html" class="back-btn">← Back</a>

    <!-- Start Screen -->
    <div class="start-screen" id="startScreen">
        <div class="start-icon">🍎</div>
        <h1 class="start-title">Fruit Catcher</h1>
        <p class="start-desc">Open your mouth to catch falling fruits! The wider you open, the bigger the catch zone.
        </p>
        <button class="start-btn" id="startBtn">Start Game</button>
    </div>

    <!-- Game Over Screen -->
    <div class="game-over" id="gameOver">
        <h2 class="game-over-title">Game Over!</h2>
        <div class="final-score" id="finalScore">0</div>
        <div class="high-score" id="highScore">High Score: 0</div>
        <button class="play-again-btn" id="playAgainBtn">Play Again</button>
        <a href="./index.html" class="back-home-btn">Back to Menu</a>
    </div>

    <!-- Game UI -->
    <div class="game-ui" id="gameUI" style="display: none;">
        <div class="score-display" id="scoreDisplay">0</div>
        <div class="combo-display" id="comboDisplay">x2 Combo!</div>
        <div class="timer-display" id="timerDisplay">60s</div>
    </div>

    <!-- Mouth Indicator -->
    <div class="mouth-indicator" id="mouthIndicator" style="display: none;">
        <div class="mouth-dot"></div>
        <span id="mouthText">Open your mouth!</span>
    </div>

    <!-- Catch Zone -->
    <div class="catch-zone" id="catchZone" style="display: none;"></div>

    <!-- AR Container -->
    <div id="container"></div>

    <script type="module">
        import * as THREE from "three";
        import { MindARThree } from "../../src/face-target/three.js";

        // ========== GAME STATE ==========
        const gameState = {
            score: 0,
            combo: 0,
            timeLeft: 60,
            isPlaying: false,
            highScore: parseInt(localStorage.getItem('fruitCatcherHighScore') || '0'),
            mouthOpen: false,
            fruits: []
        };

        const FRUITS = ['🍎', '🍊', '🍋', '🍇', '🍓', '🍑', '🍒', '🥝'];

        // ========== DOM ELEMENTS ==========
        const startScreen = document.getElementById('startScreen');
        const startBtn = document.getElementById('startBtn');
        const gameOver = document.getElementById('gameOver');
        const playAgainBtn = document.getElementById('playAgainBtn');
        const gameUI = document.getElementById('gameUI');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const comboDisplay = document.getElementById('comboDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        const mouthIndicator = document.getElementById('mouthIndicator');
        const mouthText = document.getElementById('mouthText');
        const catchZone = document.getElementById('catchZone');
        const finalScore = document.getElementById('finalScore');
        const highScoreEl = document.getElementById('highScore');

        // ========== MINDAR SETUP ==========
        const mindarThree = new MindARThree({
            container: document.querySelector("#container"),
        });
        const { renderer } = mindarThree;

        // ========== GAME FUNCTIONS ==========
        function startGame() {
            startScreen.classList.add('hidden');
            gameOver.classList.remove('visible');
            gameUI.style.display = 'flex';
            mouthIndicator.style.display = 'flex';
            catchZone.style.display = 'block';

            gameState.score = 0;
            gameState.combo = 0;
            gameState.timeLeft = 60;
            gameState.isPlaying = true;
            gameState.fruits = [];

            updateUI();
            startTimer();
            spawnFruits();
        }

        function endGame() {
            gameState.isPlaying = false;
            gameUI.style.display = 'none';
            mouthIndicator.style.display = 'none';
            catchZone.style.display = 'none';

            // Update high score
            if (gameState.score > gameState.highScore) {
                gameState.highScore = gameState.score;
                localStorage.setItem('fruitCatcherHighScore', gameState.highScore.toString());
            }

            // Clear fruits
            gameState.fruits.forEach(f => f.el.remove());
            gameState.fruits = [];

            finalScore.textContent = gameState.score;
            highScoreEl.textContent = `High Score: ${gameState.highScore}`;
            gameOver.classList.add('visible');
        }

        function updateUI() {
            scoreDisplay.textContent = gameState.score;
            timerDisplay.textContent = `${gameState.timeLeft}s`;

            if (gameState.combo >= 2) {
                comboDisplay.textContent = `x${gameState.combo} Combo!`;
                comboDisplay.classList.add('visible');
            } else {
                comboDisplay.classList.remove('visible');
            }
        }

        function startTimer() {
            const interval = setInterval(() => {
                if (!gameState.isPlaying) {
                    clearInterval(interval);
                    return;
                }

                gameState.timeLeft--;
                updateUI();

                if (gameState.timeLeft <= 0) {
                    clearInterval(interval);
                    endGame();
                }
            }, 1000);
        }

        function spawnFruits() {
            const spawn = () => {
                if (!gameState.isPlaying) return;

                const fruit = document.createElement('div');
                fruit.className = 'fruit';
                fruit.textContent = FRUITS[Math.floor(Math.random() * FRUITS.length)];
                fruit.style.left = (20 + Math.random() * 60) + '%';
                fruit.style.top = '-60px';
                document.body.appendChild(fruit);

                const fruitData = {
                    el: fruit,
                    y: -60,
                    speed: 2 + Math.random() * 2,
                    caught: false
                };
                gameState.fruits.push(fruitData);

                // Schedule next spawn
                const delay = 800 + Math.random() * 1200;
                setTimeout(spawn, delay);
            };

            spawn();
        }

        function updateFruits() {
            const catchZoneRect = catchZone.getBoundingClientRect();
            const catchCenterY = catchZoneRect.top + catchZoneRect.height / 2;

            gameState.fruits = gameState.fruits.filter(fruitData => {
                if (fruitData.caught) return false;

                fruitData.y += fruitData.speed;
                fruitData.el.style.top = fruitData.y + 'px';

                const fruitRect = fruitData.el.getBoundingClientRect();
                const fruitCenterY = fruitRect.top + fruitRect.height / 2;
                const fruitCenterX = fruitRect.left + fruitRect.width / 2;

                // Check if in catch zone
                const inZoneX = fruitCenterX > catchZoneRect.left && fruitCenterX < catchZoneRect.right;
                const inZoneY = Math.abs(fruitCenterY - catchCenterY) < 60;

                if (inZoneX && inZoneY && gameState.mouthOpen) {
                    // Caught!
                    fruitData.caught = true;
                    fruitData.el.classList.add('caught');

                    gameState.combo++;
                    const points = 10 * Math.min(gameState.combo, 5);
                    gameState.score += points;

                    // Show score popup
                    showScorePopup(points, fruitRect.left, fruitRect.top);

                    updateUI();

                    setTimeout(() => fruitData.el.remove(), 400);
                    return false;
                }

                // Check if missed (fell below screen)
                if (fruitData.y > window.innerHeight) {
                    fruitData.el.classList.add('missed');
                    gameState.combo = 0;
                    updateUI();

                    setTimeout(() => fruitData.el.remove(), 300);
                    return false;
                }

                return true;
            });
        }

        function showScorePopup(points, x, y) {
            const popup = document.createElement('div');
            popup.className = 'score-popup';
            popup.textContent = `+${points}`;
            popup.style.left = x + 'px';
            popup.style.top = y + 'px';
            document.body.appendChild(popup);

            setTimeout(() => popup.remove(), 600);
        }

        // ========== START AR ==========
        const start = async () => {
            await mindarThree.start();

            renderer.setAnimationLoop(() => {
                const estimate = mindarThree.getLatestEstimate();

                if (estimate && estimate.blendshapes) {
                    // Find mouth open score
                    const mouthOpenBlend = estimate.blendshapes.categories.find(
                        c => c.categoryName === 'jawOpen'
                    );

                    if (mouthOpenBlend) {
                        const mouthScore = mouthOpenBlend.score;
                        gameState.mouthOpen = mouthScore > 0.3;

                        // Update UI
                        if (gameState.mouthOpen) {
                            mouthIndicator.classList.add('open');
                            mouthText.textContent = 'Mouth OPEN!';
                            catchZone.classList.add('active');
                        } else {
                            mouthIndicator.classList.remove('open');
                            mouthText.textContent = 'Open your mouth!';
                            catchZone.classList.remove('active');
                        }
                    }
                }

                // Update fruits
                if (gameState.isPlaying) {
                    updateFruits();
                }
            });
        };

        // ========== EVENT LISTENERS ==========
        startBtn.addEventListener('click', () => {
            start().then(() => {
                startGame();
            });
        });

        playAgainBtn.addEventListener('click', () => {
            startGame();
        });
    </script>
</body>

</html>
