<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>AR Experience</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: white;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* ========== HEADER ========== */
        .header {
            padding: 40px 24px 20px;
            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }

        .tagline {
            margin-top: 8px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 300;
        }

        /* ========== HERO ========== */
        .hero {
            padding: 40px 20px;
            text-align: center;
            max-width: 700px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 44px;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 16px;
            background: linear-gradient(to right, #fff, #a5f3fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .hero p {
            font-size: 17px;
            color: rgba(255, 255, 255, 0.6);
            max-width: 460px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* ========== CARD ========== */
        .card-container {
            padding: 30px 24px 60px;
            max-width: 500px;
            width: 100%;
        }

        .mode-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 32px;
            display: flex;
            align-items: center;
            gap: 22px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: white;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .mode-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .mode-card:hover {
            transform: translateY(-5px) scale(1.02);
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .mode-card:hover::before {
            opacity: 1;
        }

        .mode-icon {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            flex-shrink: 0;
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);
            position: relative;
            z-index: 1;
        }

        .mode-info {
            flex: 1;
        }

        .mode-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .mode-desc {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.55);
            line-height: 1.5;
        }

        .mode-arrow {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 15px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .mode-card:hover .mode-arrow {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            transform: translateX(4px);
        }

        /* ========== PARTICLES ========== */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 15s infinite ease-in-out;
        }

        .particle:nth-child(1) {
            left: 10%;
            top: 20%;
            animation-delay: 0s;
        }

        .particle:nth-child(2) {
            left: 20%;
            top: 80%;
            animation-delay: 2s;
        }

        .particle:nth-child(3) {
            left: 70%;
            top: 30%;
            animation-delay: 4s;
        }

        .particle:nth-child(4) {
            left: 80%;
            top: 70%;
            animation-delay: 6s;
        }

        .particle:nth-child(5) {
            left: 50%;
            top: 50%;
            animation-delay: 8s;
        }

        .particle:nth-child(6) {
            left: 30%;
            top: 10%;
            animation-delay: 1s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) translateX(0);
                opacity: 0.3;
            }

            25% {
                transform: translateY(-30px) translateX(10px);
                opacity: 0.6;
            }

            50% {
                transform: translateY(-15px) translateX(-10px);
                opacity: 0.4;
            }

            75% {
                transform: translateY(-40px) translateX(5px);
                opacity: 0.5;
            }
        }

        /* ========== FOOTER ========== */
        .footer {
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
        }

        .footer a {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <header class="header">
        <div class="logo">AR Experience</div>
        <p class="tagline">Augmented Reality in your browser</p>
    </header>

    <section class="hero">
        <h1>Control AR with your hands</h1>
        <p>Build 3D voxel art using real-time hand tracking — pinch, grab, rotate & scale.</p>
    </section>

    <div class="card-container">
        <a href="./hand-control.html" class="mode-card">
            <div class="mode-icon">👋</div>
            <div class="mode-info">
                <div class="mode-title">Hand Control</div>
                <div class="mode-desc">Pinch to build cubes, grab to rotate, scale with two hands.</div>
            </div>
            <div class="mode-arrow">→</div>
        </a>
    </div>

    <footer class="footer">
        <p>Built with <a href="https://github.com/hiukim/mind-ar-js" target="_blank">MindAR.js</a></p>
    </footer>
</body>

</html>
