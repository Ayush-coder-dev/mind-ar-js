<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Head Balance - AR Game</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* ========== BACK BUTTON ========== */
        .back-btn {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: blur(10px);
            text-decoration: none;
        }

        /* ========== GAME UI ========== */
        .game-ui {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
        }

        .score-display {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 12px 20px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 18px;
            min-width: 100px;
            text-align: center;
            color: white;
            box-shadow: 0 8px 24px rgba(17, 153, 142, 0.4);
        }

        .timer-display {
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 14px;
            color: white;
            backdrop-filter: blur(10px);
        }

        /* ========== BALANCE BAR ========== */
        .balance-container {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 280px;
        }

        .balance-label {
            text-align: center;
            color: white;
            font-size: 14px;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .balance-bar {
            width: 100%;
            height: 12px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .balance-zone {
            position: absolute;
            top: 0;
            left: 40%;
            width: 20%;
            height: 100%;
            background: rgba(56, 239, 125, 0.3);
            border-left: 2px solid #38ef7d;
            border-right: 2px solid #38ef7d;
        }

        .balance-indicator {
            position: absolute;
            top: -4px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transform: translateX(-50%);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            transition: left 0.1s ease-out, background 0.2s ease;
        }

        .balance-indicator.balanced {
            background: #38ef7d;
            box-shadow: 0 0 20px #38ef7d;
        }

        .balance-indicator.danger {
            background: #ff4757;
            box-shadow: 0 0 20px #ff4757;
        }

        /* ========== OBJECT ON HEAD ========== */
        .head-object {
            position: fixed;
            z-index: 500;
            font-size: 60px;
            transition: transform 0.1s ease-out;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.3));
        }

        .head-object.wobble {
            animation: wobble 0.3s ease;
        }

        @keyframes wobble {

            0%,
            100% {
                transform: rotate(0deg);
            }

            25% {
                transform: rotate(-10deg);
            }

            75% {
                transform: rotate(10deg);
            }
        }

        .head-object.falling {
            animation: fall 0.5s ease forwards;
        }

        @keyframes fall {
            0% {
                transform: rotate(0deg) translateY(0);
                opacity: 1;
            }

            100% {
                transform: rotate(45deg) translateY(200px);
                opacity: 0;
            }
        }

        /* ========== START SCREEN ========== */
        .start-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            padding: 40px;
        }

        .start-screen.hidden {
            display: none;
        }

        .start-title {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .start-icon {
            font-size: 80px;
            margin-bottom: 24px;
        }

        .start-desc {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            max-width: 300px;
            line-height: 1.5;
            margin-bottom: 40px;
        }

        .start-btn {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            padding: 16px 48px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(17, 153, 142, 0.4);
        }

        /* ========== GAME OVER ========== */
        .game-over {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            padding: 40px;
        }

        .game-over.visible {
            display: flex;
        }

        .game-over-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .game-over-subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 24px;
        }

        .final-score {
            font-size: 56px;
            font-weight: 800;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .high-score {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 40px;
        }

        .play-again-btn {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 16px;
        }

        .back-home-btn {
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 32px;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
        }

        /* ========== LEVEL UP ========== */
        .level-up {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: 800;
            color: #38ef7d;
            text-shadow: 0 0 30px #38ef7d;
            z-index: 1500;
            pointer-events: none;
            opacity: 0;
        }

        .level-up.visible {
            animation: levelUpPop 1s ease forwards;
        }

        @keyframes levelUpPop {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 0;
            }

            20% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 1;
            }

            80% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <!-- Back Button -->
    <a href="./index.html" class="back-btn">← Back</a>

    <!-- Start Screen -->
    <div class="start-screen" id="startScreen">
        <div class="start-icon">BALL</div>
        <h1 class="start-title">Head Balance</h1>
        <p class="start-desc">Balance objects on your head by keeping it level! The longer you balance, the higher your
            score. Difficulty increases over time!</p>
        <button class="start-btn" id="startBtn">Start Game</button>
    </div>

    <!-- Game Over Screen -->
    <div class="game-over" id="gameOver">
        <h2 class="game-over-title">Object Dropped!</h2>
        <p class="game-over-subtitle" id="levelReached">You reached Level 1</p>
        <div class="final-score" id="finalScore">0s</div>
        <div class="high-score" id="highScore">Best Time: 0s</div>
        <button class="play-again-btn" id="playAgainBtn">Try Again</button>
        <a href="./index.html" class="back-home-btn">Back to Menu</a>
    </div>

    <!-- Game UI -->
    <div class="game-ui" id="gameUI" style="display: none;">
        <div class="score-display" id="scoreDisplay">Time: 0s</div>
        <div class="timer-display" id="levelDisplay">Level 1</div>
    </div>

    <!-- Balance Bar -->
    <div class="balance-container" id="balanceContainer" style="display: none;">
        <div class="balance-label">Keep your head level!</div>
        <div class="balance-bar">
            <div class="balance-zone"></div>
            <div class="balance-indicator" id="balanceIndicator"></div>
        </div>
    </div>

    <!-- Object on Head -->
    <div class="head-object" id="headObject" style="display: none;">O</div>

    <!-- Level Up -->
    <div class="level-up" id="levelUp">LEVEL UP!</div>

    <!-- AR Container -->
    <div id="container"></div>

    <script type="module">
        import * as THREE from "three";
        import { MindARThree } from "../../src/face-target/three.js";

        // ========== GAME STATE ==========
        const OBJECTS = ['O', '*', '#', '@', '%', '&'];

        const gameState = {
            time: 0,
            level: 1,
            isPlaying: false,
            highScore: parseFloat(localStorage.getItem('headBalanceHighScore') || '0'),
            headTilt: 0, // -1 to 1
            balanceZone: 0.15, // How centered you need to be
            wobbleCount: 0
        };

        // ========== DOM ELEMENTS ==========
        const startScreen = document.getElementById('startScreen');
        const startBtn = document.getElementById('startBtn');
        const gameOver = document.getElementById('gameOver');
        const playAgainBtn = document.getElementById('playAgainBtn');
        const gameUI = document.getElementById('gameUI');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const levelDisplay = document.getElementById('levelDisplay');
        const balanceContainer = document.getElementById('balanceContainer');
        const balanceIndicator = document.getElementById('balanceIndicator');
        const headObject = document.getElementById('headObject');
        const levelUp = document.getElementById('levelUp');
        const finalScore = document.getElementById('finalScore');
        const levelReached = document.getElementById('levelReached');
        const highScoreEl = document.getElementById('highScore');

        // ========== MINDAR SETUP ==========
        const mindarThree = new MindARThree({
            container: document.querySelector("#container"),
        });
        const { renderer } = mindarThree;

        // ========== GAME FUNCTIONS ==========
        function startGame() {
            startScreen.classList.add('hidden');
            gameOver.classList.remove('visible');
            gameUI.style.display = 'flex';
            balanceContainer.style.display = 'block';
            headObject.style.display = 'block';

            gameState.time = 0;
            gameState.level = 1;
            gameState.isPlaying = true;
            gameState.balanceZone = 0.2;
            gameState.wobbleCount = 0;

            headObject.textContent = OBJECTS[0];
            headObject.classList.remove('falling', 'wobble');

            updateUI();
            startTimer();
        }

        function endGame() {
            gameState.isPlaying = false;

            headObject.classList.add('falling');

            setTimeout(() => {
                gameUI.style.display = 'none';
                balanceContainer.style.display = 'none';
                headObject.style.display = 'none';

                if (gameState.time > gameState.highScore) {
                    gameState.highScore = gameState.time;
                    localStorage.setItem('headBalanceHighScore', gameState.highScore.toString());
                }

                finalScore.textContent = gameState.time.toFixed(1) + 's';
                levelReached.textContent = `You reached Level ${gameState.level}`;
                highScoreEl.textContent = `Best Time: ${gameState.highScore.toFixed(1)}s`;
                gameOver.classList.add('visible');
            }, 500);
        }

        function updateUI() {
            scoreDisplay.textContent = `Time: ${gameState.time.toFixed(1)}s`;
            levelDisplay.textContent = `Level ${gameState.level}`;
        }

        function startTimer() {
            const interval = setInterval(() => {
                if (!gameState.isPlaying) {
                    clearInterval(interval);
                    return;
                }

                gameState.time += 0.1;

                // Level up every 10 seconds
                const newLevel = Math.floor(gameState.time / 10) + 1;
                if (newLevel > gameState.level && newLevel <= OBJECTS.length) {
                    gameState.level = newLevel;
                    gameState.balanceZone = Math.max(0.1, 0.2 - (gameState.level - 1) * 0.02);
                    headObject.textContent = OBJECTS[gameState.level - 1];

                    levelUp.classList.add('visible');
                    setTimeout(() => levelUp.classList.remove('visible'), 1000);
                }

                updateUI();
            }, 100);
        }

        // ========== START AR ==========
        const start = async () => {
            await mindarThree.start();

            renderer.setAnimationLoop(() => {
                const estimate = mindarThree.getLatestEstimate();

                if (estimate && estimate.faceMatrix && gameState.isPlaying) {
                    // Get head rotation from matrix
                    const matrix = estimate.faceMatrix;

                    // Extract Z rotation (tilt) - approximate from matrix
                    // This gives us head tilt left/right
                    const tilt = matrix[4] * 2; // Simplified extraction

                    gameState.headTilt = Math.max(-1, Math.min(1, tilt));

                    // Update balance indicator
                    const indicatorPos = 50 + gameState.headTilt * 50;
                    balanceIndicator.style.left = indicatorPos + '%';

                    // Check if balanced
                    const isBalanced = Math.abs(gameState.headTilt) < gameState.balanceZone;
                    const isDanger = Math.abs(gameState.headTilt) > 0.7;

                    balanceIndicator.classList.toggle('balanced', isBalanced);
                    balanceIndicator.classList.toggle('danger', isDanger);

                    // Update head object position (follows face)
                    if (estimate.faceMatrix) {
                        const faceX = window.innerWidth / 2 - matrix[12] * window.innerWidth * 0.3;
                        const faceY = window.innerHeight * 0.25 - matrix[13] * window.innerHeight * 0.2;
                        headObject.style.left = faceX + 'px';
                        headObject.style.top = faceY + 'px';
                        headObject.style.transform = `translate(-50%, -50%) rotate(${gameState.headTilt * 30}deg)`;
                    }

                    // Check for failure
                    if (Math.abs(gameState.headTilt) > 0.85) {
                        gameState.wobbleCount++;
                        if (gameState.wobbleCount > 5) {
                            endGame();
                        } else {
                            headObject.classList.add('wobble');
                            setTimeout(() => headObject.classList.remove('wobble'), 300);
                        }
                    } else {
                        gameState.wobbleCount = Math.max(0, gameState.wobbleCount - 1);
                    }
                }
            });
        };

        // ========== EVENT LISTENERS ==========
        startBtn.addEventListener('click', () => {
            start().then(() => {
                startGame();
            });
        });

        playAgainBtn.addEventListener('click', () => {
            startGame();
        });
    </script>
</body>

</html>
