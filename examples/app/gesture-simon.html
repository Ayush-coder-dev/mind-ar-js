<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Gesture Simon - AR Memory Game</title>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #111;
            color: white;
            overflow: hidden;
        }

        #video {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
        }

        #canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
        }

        .ui-layer {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 20px;
            color: white;
            text-decoration: none;
            backdrop-filter: blur(5px);
            pointer-events: auto;
            font-weight: 500;
        }

        .score-board {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 30px;
            border-radius: 30px;
            font-size: 24px;
            font-weight: 700;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .game-status {
            margin-top: 15px;
            font-size: 18px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .gestures-container {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        .gesture-card {
            width: 80px;
            height: 100px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }

        .gesture-card.active {
            transform: scale(1.15) translateY(-5px);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            border-color: white;
        }

        .gesture-card.correct {
            background: rgba(34, 197, 94, 0.4);
            border-color: #22c55e;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.6);
        }

        .gesture-card.wrong {
            background: rgba(239, 68, 68, 0.4);
            border-color: #ef4444;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
            animation: shake 0.4s ease;
        }

        .gesture-emoji {
            font-size: 32px;
            margin-bottom: 5px;
        }

        .gesture-name {
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 600;
            opacity: 0.8;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            pointer-events: auto;
        }

        .overlay h1 {
            font-size: 48px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .overlay p {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 40px;
            max-width: 400px;
            text-align: center;
            line-height: 1.5;
        }

        .btn {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            border: none;
            padding: 16px 40px;
            border-radius: 30px;
            color: black;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(245, 158, 11, 0.4);
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.6);
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-8px) rotate(-5deg);
            }

            75% {
                transform: translateX(8px) rotate(5deg);
            }
        }

        .countdown {
            font-size: 120px;
            font-weight: 900;
            color: white;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Highlight classes for Simon sequence */
        .highlight-open {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.4);
            box-shadow: 0 0 20px #3b82f6;
        }

        .highlight-closed {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.4);
            box-shadow: 0 0 20px #ef4444;
        }

        .highlight-victory {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.4);
            box-shadow: 0 0 20px #22c55e;
        }

        .highlight-point {
            border-color: #eab308;
            background: rgba(234, 179, 8, 0.4);
            box-shadow: 0 0 20px #eab308;
        }
    </style>
</head>

<body>
    <video id="video" playsinline></video>
    <canvas id="canvas"></canvas>

    <div class="ui-layer">
        <a href="index.html" class="back-btn">← Back</a>

        <div class="score-board">Score: <span id="scoreVal">0</span></div>
        <div class="game-status" id="gameStatus">Waiting for start...</div>

        <div class="gestures-container">
            <div class="gesture-card" id="card-open">
                <div class="gesture-emoji">✋</div>
                <div class="gesture-name">Open</div>
            </div>
            <div class="gesture-card" id="card-closed">
                <div class="gesture-emoji">✊</div>
                <div class="gesture-name">Fist</div>
            </div>
            <div class="gesture-card" id="card-victory">
                <div class="gesture-emoji">✌️</div>
                <div class="gesture-name">Victory</div>
            </div>
            <div class="gesture-card" id="card-point">
                <div class="gesture-emoji">☝️</div>
                <div class="gesture-name">Point</div>
            </div>
        </div>
    </div>

    <!-- Start Screen Overlay -->
    <div class="overlay" id="startScreen">
        <h1>Gesture Simon</h1>
        <p>Memorize the sequence of gestures and repeat them back!<br>Use your hand to play.</p>
        <button class="btn" onclick="startGame()">Start Game</button>
    </div>

    <!-- Game Over Overlay -->
    <div class="overlay" id="gameOverScreen" style="display: none;">
        <h1>Game Over!</h1>
        <p>You reached Level <span id="finalLevel">1</span></p>
        <button class="btn" onclick="resetGame()">Play Again</button>
    </div>

    <script>
        // Game State Variables
        const GESTURES = ['open', 'closed', 'victory', 'point'];
        let sequence = [];
        let playerIndex = 0;
        let score = 0;
        let isGameActive = false;
        let isShowingSequence = false;
        let lastDetectedGesture = null;
        let gestureHoldFrames = 0;
        const HOLD_THRESHOLD = 5; // Frames to hold gesture to confirm

        // Elements
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const scoreVal = document.getElementById('scoreVal');
        const gameStatus = document.getElementById('gameStatus');
        const cards = {
            open: document.getElementById('card-open'),
            closed: document.getElementById('card-closed'),
            victory: document.getElementById('card-victory'),
            point: document.getElementById('card-point')
        };

        // Resize Canvas
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Game Functions
        function startGame() {
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            score = 0;
            sequence = [];
            scoreVal.textContent = score;
            isGameActive = true;
            nextRound();
        }

        function resetGame() {
            startScreen.style.display = 'flex';
            gameOverScreen.style.display = 'none';
        }

        function nextRound() {
            playerIndex = 0;
            score++;
            scoreVal.textContent = score - 1; // Score is completed rounds

            // Add random gesture
            const nextGesture = GESTURES[Math.floor(Math.random() * GESTURES.length)];
            sequence.push(nextGesture);

            playSequence();
        }

        async function playSequence() {
            isShowingSequence = true;
            gameStatus.textContent = "Watch carefully...";

            // Wait a bit before starting
            await new Promise(r => setTimeout(r, 1000));

            for (let gesture of sequence) {
                highlightCard(gesture, true);
                await new Promise(r => setTimeout(r, 800)); // Show duration
                highlightCard(gesture, false);
                await new Promise(r => setTimeout(r, 300)); // Gap
            }

            isShowingSequence = false;
            gameStatus.textContent = "Your Turn!";
        }

        function highlightCard(gesture, active) {
            // Reset all first
            if (!active) {
                Object.values(cards).forEach(c => c.className = 'gesture-card');
                return;
            }

            const card = cards[gesture];
            let highlightClass = '';
            // Reset to base
            card.className = 'gesture-card active';

            if (gesture === 'open') card.classList.add('highlight-open');
            if (gesture === 'closed') card.classList.add('highlight-closed');
            if (gesture === 'victory') card.classList.add('highlight-victory');
            if (gesture === 'point') card.classList.add('highlight-point');
        }

        function handleInput(gesture) {
            if (!isGameActive || isShowingSequence) return;

            const expected = sequence[playerIndex];

            // Feedback on card
            const card = cards[gesture];
            card.classList.add('active');

            if (gesture === expected) {
                card.classList.add('correct');
                gameStatus.textContent = "Correct!";
                setTimeout(() => card.classList.remove('active', 'correct'), 300);

                playerIndex++;
                if (playerIndex >= sequence.length) {
                    gameStatus.textContent = "Round Complete!";
                    setTimeout(nextRound, 1000);
                }
            } else {
                card.classList.add('wrong');
                gameOver();
            }
        }

        function gameOver() {
            isGameActive = false;
            document.getElementById('finalLevel').textContent = score;
            setTimeout(() => {
                gameOverScreen.style.display = 'flex';
            }, 1000);
        }

        // Gesture Detection Logic
        function detectGesture(lm) {
            // 1. Fingers Extended Check
            // Tips: 8(Idx), 12(Mid), 16(Ring), 20(Pinky)
            // PIPs: 6, 10, 14, 18
            const isIndexOpen = lm[8].y < lm[6].y;
            const isMiddleOpen = lm[12].y < lm[10].y;
            const isRingOpen = lm[16].y < lm[14].y;
            const isPinkyOpen = lm[20].y < lm[18].y;
            // Thumb is tricky, check x distance from Wrist(0) vs IndexMCP(5)
            // Simple check: ThumbTip(4) x is further from PinkyMCP(17) than ThumbIP(3)
            // Actually for simple gestures:

            let gesture = 'unknown';

            // Count open fingers (excluding thumb for simplicity first)
            let openCount = 0;
            if (isIndexOpen) openCount++;
            if (isMiddleOpen) openCount++;
            if (isRingOpen) openCount++;
            if (isPinkyOpen) openCount++;

            // VICTORY: Index & Middle Open, others closed
            if (isIndexOpen && isMiddleOpen && !isRingOpen && !isPinkyOpen) {
                gesture = 'victory';
            }
            // POINT: Index Open, others closed
            else if (isIndexOpen && !isMiddleOpen && !isRingOpen && !isPinkyOpen) {
                gesture = 'point';
            }
            // OPEN: All 4 open
            else if (openCount === 4) {
                gesture = 'open';
            }
            // CLOSED: All 4 closed
            else if (openCount === 0) {
                gesture = 'closed';
            }

            return gesture;
        }

        // MediaPipe Setup
        function onResults(results) {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear only if not showing sequence overlay
            // Actually we can draw hand even during sequence

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const lm = results.multiHandLandmarks[0];
                drawConnectors(ctx, lm, HAND_CONNECTIONS, { color: 'rgba(255, 255, 255, 0.5)', lineWidth: 2 });
                drawLandmarks(ctx, lm, { color: '#fbbf24', lineWidth: 1, radius: 2 });

                // Detect
                const currentGesture = detectGesture(lm);

                if (currentGesture !== 'unknown') {
                    if (currentGesture === lastDetectedGesture) {
                        gestureHoldFrames++;
                    } else {
                        gestureHoldFrames = 0;
                        lastDetectedGesture = currentGesture;
                    }

                    if (gestureHoldFrames === HOLD_THRESHOLD) {
                        // Confirmed gesture
                        console.log("Confirmed: " + currentGesture);
                        handleInput(currentGesture);
                    }
                } else {
                    gestureHoldFrames = 0;
                    lastDetectedGesture = null;
                }
            }
        }

        const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.5
        });
        hands.onResults(onResults);

        const camera = new Camera(video, {
            onFrame: async () => {
                await hands.send({ image: video });
            },
            width: 1280,
            height: 720
        });
        camera.start();

    </script>
</body>

</html>
