<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Gesture Simon - AR Memory Game</title>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            touch-action: none;
            background: #000;
        }

        #video {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
        }

        #handCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 5;
        }

        .back-btn {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 16px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            backdrop-filter: blur(10px);
        }

        .ui-panel {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            padding: 16px 20px;
            border-radius: 16px;
            color: white;
            font-size: 13px;
            backdrop-filter: blur(10px);
            min-width: 160px;
        }

        .ui-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .ui-label {
            color: rgba(255, 255, 255, 0.6);
        }

        .ui-value {
            font-weight: 600;
            font-family: monospace;
        }

        .ui-value.watching {
            color: #fbbf24;
        }

        .ui-value.playing {
            color: #22c55e;
        }

        .ui-value.wrong {
            color: #ef4444;
        }

        .game-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
        }

        .gesture-display {
            width: 180px;
            height: 180px;
            background: rgba(0, 0, 0, 0.6);
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 80px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .gesture-display.showing {
            border-color: #fbbf24;
            box-shadow: 0 0 40px rgba(251, 191, 36, 0.5);
            transform: scale(1.1);
        }

        .gesture-display.correct {
            border-color: #22c55e;
            box-shadow: 0 0 40px rgba(34, 197, 94, 0.5);
            background: rgba(34, 197, 94, 0.2);
        }

        .gesture-display.wrong {
            border-color: #ef4444;
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.5);
            background: rgba(239, 68, 68, 0.2);
            animation: shake 0.5s ease;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            75% {
                transform: translateX(10px);
            }
        }

        .status-text {
            font-size: 24px;
            font-weight: 700;
            color: white;
            margin-bottom: 10px;
        }

        .gesture-sequence {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 350px;
            margin: 0 auto;
        }

        .sequence-dot {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .sequence-dot.active {
            background: rgba(251, 191, 36, 0.4);
            border: 2px solid #fbbf24;
        }

        .sequence-dot.done {
            background: rgba(34, 197, 94, 0.4);
            border: 2px solid #22c55e;
        }

        .gesture-buttons {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 12px;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 24px;
            backdrop-filter: blur(10px);
        }

        .gesture-btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gesture-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .gesture-btn.active {
            border-color: #fbbf24;
            background: rgba(251, 191, 36, 0.3);
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
        }

        .gesture-btn.detected {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.3);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
        }

        .instructions {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0, 0, 0, 0.85);
            padding: 12px 20px;
            border-radius: 14px;
            color: white;
            font-size: 13px;
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .instructions .yellow {
            color: #fbbf24;
            font-weight: 600;
        }

        .instructions .green {
            color: #22c55e;
            font-weight: 600;
        }

        .start-btn {
            padding: 14px 32px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #000;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(251, 191, 36, 0.4);
        }

        .loading-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .loading-screen.hidden {
            display: none;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fbbf24;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .game-over {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1500;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .game-over.show {
            display: flex;
        }

        .game-over h2 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .game-over .score {
            font-size: 60px;
            font-weight: 800;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
        }
    </style>
</head>

<body>
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading Gesture Simon...</div>
    </div>

    <div class="game-over" id="gameOver">
        <h2>Game Over!</h2>
        <div class="score" id="finalScore">0</div>
        <button class="start-btn" onclick="startGame()">Play Again</button>
    </div>

    <a href="./index.html" class="back-btn">← Back</a>

    <div class="ui-panel">
        <div class="ui-row"><span class="ui-label">Level:</span><span class="ui-value" id="levelValue">1</span></div>
        <div class="ui-row"><span class="ui-label">Score:</span><span class="ui-value" id="scoreValue">0</span></div>
        <div class="ui-row"><span class="ui-label">Phase:</span><span class="ui-value" id="phaseValue">Ready</span>
        </div>
        <div class="ui-row"><span class="ui-label">Gesture:</span><span class="ui-value" id="gestureValue">-</span>
        </div>
    </div>

    <div class="game-container" id="gameContainer">
        <div class="gesture-display" id="gestureDisplay">🎮</div>
        <div class="status-text" id="statusText">Ready to play?</div>
        <div class="gesture-sequence" id="gestureSequence"></div>
        <button class="start-btn" id="startBtn" onclick="startGame()">Start Game</button>
    </div>

    <div class="gesture-buttons" id="gestureButtons">
        <div class="gesture-btn" data-gesture="fist">✊</div>
        <div class="gesture-btn" data-gesture="peace">✌️</div>
        <div class="gesture-btn" data-gesture="thumbsUp">👍</div>
        <div class="gesture-btn" data-gesture="openHand">🖐️</div>
        <div class="gesture-btn" data-gesture="point">👆</div>
    </div>

    <div class="instructions">
        <span class="yellow">Watch</span> the gesture sequence, then <span class="green">repeat</span> it with your
        hand!
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="handCanvas"></canvas>

    <script>
        const GESTURES = [
            { name: 'fist', emoji: '✊', detect: detectFist },
            { name: 'peace', emoji: '✌️', detect: detectPeace },
            { name: 'thumbsUp', emoji: '👍', detect: detectThumbsUp },
            { name: 'openHand', emoji: '🖐️', detect: detectOpenHand },
            { name: 'point', emoji: '👆', detect: detectPoint }
        ];

        const GESTURE_HOLD_FRAMES = 10;
        const SHOW_DURATION = 800;
        const PAUSE_DURATION = 400;

        const video = document.getElementById('video');
        const handCanvas = document.getElementById('handCanvas');
        const loadingScreen = document.getElementById('loadingScreen');
        const gestureDisplay = document.getElementById('gestureDisplay');
        const statusText = document.getElementById('statusText');
        const gestureSequence = document.getElementById('gestureSequence');
        const startBtn = document.getElementById('startBtn');
        const gameOver = document.getElementById('gameOver');
        const finalScore = document.getElementById('finalScore');
        const levelValue = document.getElementById('levelValue');
        const scoreValue = document.getElementById('scoreValue');
        const phaseValue = document.getElementById('phaseValue');
        const gestureValue = document.getElementById('gestureValue');
        const gestureButtons = document.getElementById('gestureButtons');

        const handCtx = handCanvas.getContext('2d');

        let sequence = [];
        let playerIndex = 0;
        let level = 1;
        let score = 0;
        let gameState = 'idle'; // idle, showing, playing
        let currentGestureFrames = {};
        let lastDetectedGesture = null;
        let gestureConfirmed = false;

        function resizeCanvas() {
            handCanvas.width = window.innerWidth;
            handCanvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ========== GESTURE DETECTION ==========
        function detectFist(lm) {
            const tips = [8, 12, 16, 20];
            const pips = [6, 10, 14, 18];
            for (let i = 0; i < 4; i++) {
                if (lm[tips[i]].y < lm[pips[i]].y) return false;
            }
            return true;
        }

        function detectPeace(lm) {
            // Index and middle up, others down
            const indexUp = lm[8].y < lm[6].y;
            const middleUp = lm[12].y < lm[10].y;
            const ringDown = lm[16].y > lm[14].y;
            const pinkyDown = lm[20].y > lm[18].y;
            return indexUp && middleUp && ringDown && pinkyDown;
        }

        function detectThumbsUp(lm) {
            // Thumb up, all fingers curled
            const thumbUp = lm[4].y < lm[3].y && lm[4].y < lm[2].y;
            const fingersDown = lm[8].y > lm[6].y && lm[12].y > lm[10].y &&
                lm[16].y > lm[14].y && lm[20].y > lm[18].y;
            return thumbUp && fingersDown;
        }

        function detectOpenHand(lm) {
            // All fingers extended
            const allUp = lm[8].y < lm[6].y && lm[12].y < lm[10].y &&
                lm[16].y < lm[14].y && lm[20].y < lm[18].y;
            // Fingers spread apart
            const spread = Math.abs(lm[8].x - lm[20].x) > 0.15;
            return allUp && spread;
        }

        function detectPoint(lm) {
            // Only index finger up
            const indexUp = lm[8].y < lm[6].y;
            const middleDown = lm[12].y > lm[10].y;
            const ringDown = lm[16].y > lm[14].y;
            const pinkyDown = lm[20].y > lm[18].y;
            return indexUp && middleDown && ringDown && pinkyDown;
        }

        function detectCurrentGesture(lm) {
            for (const gesture of GESTURES) {
                if (gesture.detect(lm)) {
                    return gesture.name;
                }
            }
            return null;
        }

        // ========== GAME LOGIC ==========
        function startGame() {
            sequence = [];
            playerIndex = 0;
            level = 1;
            score = 0;
            gameState = 'idle';
            gameOver.classList.remove('show');
            startBtn.style.display = 'none';
            updateUI();
            addToSequence();
        }

        function addToSequence() {
            const randomGesture = GESTURES[Math.floor(Math.random() * GESTURES.length)];
            sequence.push(randomGesture);
            showSequence();
        }

        async function showSequence() {
            gameState = 'showing';
            playerIndex = 0;
            gestureConfirmed = false;
            statusText.textContent = 'Watch carefully...';
            phaseValue.textContent = 'WATCH';
            phaseValue.className = 'ui-value watching';
            updateSequenceDots();

            for (let i = 0; i < sequence.length; i++) {
                const gesture = sequence[i];

                gestureDisplay.textContent = gesture.emoji;
                gestureDisplay.classList.add('showing');
                highlightButton(gesture.name, true);
                updateSequenceDots(i);

                await sleep(SHOW_DURATION);

                gestureDisplay.classList.remove('showing');
                highlightButton(gesture.name, false);

                await sleep(PAUSE_DURATION);
            }

            gestureDisplay.textContent = '❓';
            statusText.textContent = 'Your turn! Copy the sequence';
            phaseValue.textContent = 'PLAY';
            phaseValue.className = 'ui-value playing';
            gameState = 'playing';
            updateSequenceDots();
        }

        function highlightButton(gestureName, active) {
            const btn = document.querySelector(`.gesture-btn[data-gesture="${gestureName}"]`);
            if (btn) {
                btn.classList.toggle('active', active);
            }
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function updateUI() {
            levelValue.textContent = level;
            scoreValue.textContent = score;
        }

        function updateSequenceDots(showingIndex = -1) {
            gestureSequence.innerHTML = '';
            for (let i = 0; i < sequence.length; i++) {
                const dot = document.createElement('div');
                dot.className = 'sequence-dot';

                if (gameState === 'showing' && i === showingIndex) {
                    dot.classList.add('active');
                } else if (gameState === 'playing' && i < playerIndex) {
                    dot.classList.add('done');
                } else if (gameState === 'playing' && i === playerIndex) {
                    dot.classList.add('active');
                }

                dot.textContent = sequence[i].emoji;
                gestureSequence.appendChild(dot);
            }
        }

        function handleGestureInput(gestureName) {
            if (gameState !== 'playing' || gestureConfirmed) return;

            const expectedGesture = sequence[playerIndex];

            if (gestureName === expectedGesture.name) {
                // Correct!
                gestureConfirmed = true;
                gestureDisplay.textContent = expectedGesture.emoji;
                gestureDisplay.classList.add('correct');
                score += 10 * level;
                playerIndex++;
                updateUI();
                updateSequenceDots();

                setTimeout(() => {
                    gestureConfirmed = false;
                    gestureDisplay.classList.remove('correct');

                    if (playerIndex >= sequence.length) {
                        // Level complete!
                        level++;
                        updateUI();
                        statusText.textContent = 'Great! Level ' + level;
                        setTimeout(() => addToSequence(), 1000);
                    } else {
                        gestureDisplay.textContent = '❓';
                    }
                }, 600);
            } else {
                // Wrong!
                gameState = 'idle';
                gestureDisplay.textContent = '❌';
                gestureDisplay.classList.add('wrong');
                statusText.textContent = 'Wrong gesture!';
                phaseValue.textContent = 'WRONG';
                phaseValue.className = 'ui-value wrong';

                setTimeout(() => {
                    gestureDisplay.classList.remove('wrong');
                    finalScore.textContent = score;
                    gameOver.classList.add('show');
                }, 1500);
            }
        }

        // ========== HAND TRACKING ==========
        const hands = new Hands({
            locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
        });
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.75,
            minTrackingConfidence: 0.6
        });
        hands.onResults(onResults);

        function onResults(results) {
            handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);

            // Reset button detection highlights
            document.querySelectorAll('.gesture-btn').forEach(btn => {
                btn.classList.remove('detected');
            });

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const lm = results.multiHandLandmarks[0];

                drawConnectors(handCtx, lm, HAND_CONNECTIONS, {
                    color: 'rgba(251, 191, 36, 0.4)',
                    lineWidth: 2
                });
                drawLandmarks(handCtx, lm, {
                    color: '#fbbf24',
                    lineWidth: 1,
                    radius: 3
                });

                const gesture = detectCurrentGesture(lm);

                if (gesture) {
                    currentGestureFrames[gesture] = (currentGestureFrames[gesture] || 0) + 1;

                    // Highlight detected gesture button
                    const btn = document.querySelector(`.gesture-btn[data-gesture="${gesture}"]`);
                    if (btn) btn.classList.add('detected');

                    gestureValue.textContent = GESTURES.find(g => g.name === gesture)?.emoji || '-';

                    if (currentGestureFrames[gesture] >= GESTURE_HOLD_FRAMES) {
                        if (gesture !== lastDetectedGesture) {
                            lastDetectedGesture = gesture;
                            handleGestureInput(gesture);
                        }
                    }
                } else {
                    currentGestureFrames = {};
                    lastDetectedGesture = null;
                    gestureValue.textContent = '-';
                }
            } else {
                currentGestureFrames = {};
                lastDetectedGesture = null;
                gestureValue.textContent = '-';
            }
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: 1280, height: 720 }
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    const camera = new Camera(video, {
                        onFrame: async () => await hands.send({ image: video }),
                        width: 1280,
                        height: 720
                    });
                    camera.start();
                    setTimeout(() => {
                        loadingScreen.classList.add('hidden');
                    }, 1200);
                };
            } catch (e) {
                loadingScreen.querySelector('.loading-text').textContent = 'Camera access denied';
            }
        }

        startCamera();
    </script>
</body>

</html>
