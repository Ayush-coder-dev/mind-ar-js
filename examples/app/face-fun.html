<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Face Fun - Try On</title>
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
    <script src="../../src/face-target/aframe.js" type="module"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        .example-container {
            position: fixed;
            inset: 0;
            overflow: hidden;
        }

        /* ========== LOADING SCREEN ========== */
        .loading-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            transition: opacity 0.5s ease;
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #f093fb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
        }

        .loading-progress {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin-top: 16px;
            overflow: hidden;
        }

        .loading-bar {
            height: 100%;
            background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* ========== BACK BUTTON ========== */
        .back-btn {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: blur(10px);
            text-decoration: none;
            font-family: 'Inter', sans-serif;
        }

        /* ========== HEADER ========== */
        .header {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            text-align: center;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: white;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        /* ========== CATEGORY TABS ========== */
        .category-tabs {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .category-tab {
            padding: 8px 16px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            background: transparent;
        }

        .category-tab.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        /* ========== ACCESSORIES PANEL ========== */
        .accessories-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.8) 100%);
            padding: 20px 0 30px;
        }

        .accessories-scroll {
            display: flex;
            gap: 12px;
            padding: 0 20px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .accessories-scroll::-webkit-scrollbar {
            display: none;
        }

        .accessory-item {
            flex-shrink: 0;
            width: 70px;
            height: 70px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            scroll-snap-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .accessory-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .accessory-item.selected {
            border-color: #f093fb;
            box-shadow: 0 0 20px rgba(240, 147, 251, 0.5);
            transform: scale(1.1);
        }

        .accessory-item:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* ========== CAPTURE BUTTON ========== */
        .capture-btn {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: white;
            border: 4px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
        }

        .capture-btn:hover {
            transform: translateX(-50%) scale(1.05);
        }

        .capture-btn:active {
            transform: translateX(-50%) scale(0.95);
        }

        .capture-btn::after {
            content: '';
            position: absolute;
            inset: 6px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        /* ========== FLASH EFFECT ========== */
        .flash {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s ease;
        }

        .flash.active {
            opacity: 1;
        }

        /* ========== TOAST ========== */
        .toast {
            position: fixed;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            z-index: 10000;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading Face Tracking...</div>
        <div class="loading-progress">
            <div class="loading-bar" id="loadingBar"></div>
        </div>
    </div>

    <!-- Flash Effect -->
    <div class="flash" id="flash"></div>

    <!-- Toast -->
    <div class="toast" id="toast">Photo saved!</div>

    <!-- Back Button -->
    <a href="../app/index.html" class="back-btn">← Menu</a>

    <!-- Header -->
    <div class="header">
        <h1>Try On Accessories</h1>
    </div>

    <!-- Category Tabs -->
    <div class="category-tabs">
        <button class="category-tab active" data-category="all">All</button>
        <button class="category-tab" data-category="glasses">Glasses</button>
        <button class="category-tab" data-category="hats">Hats</button>
        <button class="category-tab" data-category="earrings">Earrings</button>
    </div>

    <!-- Accessories Panel -->
    <div class="accessories-panel">
        <div class="accessories-scroll" id="accessoriesScroll">
            <div class="accessory-item selected" data-id="glasses1" data-category="glasses">
                <img src="../face-tracking/assets/glasses/thumbnail.png" alt="Glasses 1">
            </div>
            <div class="accessory-item" data-id="glasses2" data-category="glasses">
                <img src="../face-tracking/assets/glasses2/thumbnail.png" alt="Glasses 2">
            </div>
            <div class="accessory-item" data-id="hat1" data-category="hats">
                <img src="../face-tracking/assets/hat/thumbnail.png" alt="Hat 1">
            </div>
            <div class="accessory-item" data-id="hat2" data-category="hats">
                <img src="../face-tracking/assets/hat2/thumbnail.png" alt="Hat 2">
            </div>
            <div class="accessory-item" data-id="earring" data-category="earrings">
                <img src="../face-tracking/assets/earring/thumbnail.png" alt="Earrings">
            </div>
        </div>
    </div>

    <!-- Capture Button -->
    <button class="capture-btn" id="captureBtn" title="Take Photo"></button>

    <!-- AR Scene -->
    <div class="example-container">
        <a-scene mindar-face embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights"
            vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
            <a-assets timeout="30000">
                <a-asset-item id="headModel" src="../face-tracking/assets/sparkar/headOccluder.glb"></a-asset-item>
                <a-asset-item id="glassesModel" src="../face-tracking/assets/glasses/scene.gltf"></a-asset-item>
                <a-asset-item id="glassesModel2" src="../face-tracking/assets/glasses2/scene.gltf"></a-asset-item>
                <a-asset-item id="hatModel" src="../face-tracking/assets/hat/scene.gltf"></a-asset-item>
                <a-asset-item id="hatModel2" src="../face-tracking/assets/hat2/scene.gltf"></a-asset-item>
                <a-asset-item id="earringModel" src="../face-tracking/assets/earring/scene.gltf"></a-asset-item>
            </a-assets>

            <a-camera active="false" position="0 0 0" look-controls="enabled: false"></a-camera>

            <!-- Head occluder -->
            <a-entity mindar-face-target="anchorIndex: 168">
                <a-gltf-model mindar-face-occluder position="0 -0.3 0.15" rotation="0 0 0" scale="0.065 0.065 0.065"
                    src="#headModel"></a-gltf-model>
            </a-entity>

            <!-- Glasses 1 -->
            <a-entity mindar-face-target="anchorIndex: 168">
                <a-gltf-model rotation="0 0 0" position="0 0 -0.1" scale="0.009 0.009 0.009" src="#glassesModel"
                    class="glasses1-entity" visible="true"></a-gltf-model>
            </a-entity>

            <!-- Glasses 2 -->
            <a-entity mindar-face-target="anchorIndex: 168">
                <a-gltf-model rotation="0 -90 0" position="0 -0.4 -0.25" scale="0.6 0.6 0.6" src="#glassesModel2"
                    class="glasses2-entity" visible="false"></a-gltf-model>
            </a-entity>

            <!-- Hat 1 -->
            <a-entity mindar-face-target="anchorIndex: 10">
                <a-gltf-model rotation="0 0 0" position="0 1.0 -0.5" scale="0.5 0.5 0.5" src="#hatModel"
                    class="hat1-entity" visible="false"></a-gltf-model>
            </a-entity>

            <!-- Hat 2 -->
            <a-entity mindar-face-target="anchorIndex: 10">
                <a-gltf-model rotation="15 0 0" position="0 -0.22 -0.7" scale="0.01 0.01 0.01" src="#hatModel2"
                    class="hat2-entity" visible="false"></a-gltf-model>
            </a-entity>

            <!-- Earring Left -->
            <a-entity mindar-face-target="anchorIndex: 127">
                <a-gltf-model rotation="-0.1 -50 0" position="-0.05 -0.4 -0.3" scale="0.07 0.07 0.07"
                    src="#earringModel" class="earring-entity" visible="false"></a-gltf-model>
            </a-entity>

            <!-- Earring Right -->
            <a-entity mindar-face-target="anchorIndex: 356">
                <a-gltf-model rotation="0.1 50 0" position="0.05 -0.4 -0.3" scale="0.07 0.07 0.07" src="#earringModel"
                    class="earring-entity" visible="false"></a-gltf-model>
            </a-entity>
        </a-scene>
    </div>

    <script>
        // ========== LOADING ==========
        const loadingScreen = document.getElementById('loadingScreen');
        const loadingBar = document.getElementById('loadingBar');

        // Simulate loading progress
        let progress = 0;
        const loadInterval = setInterval(() => {
            progress += Math.random() * 15;
            if (progress >= 100) {
                progress = 100;
                clearInterval(loadInterval);
            }
            loadingBar.style.width = progress + '%';
        }, 200);

        // Hide loading when scene is ready
        document.querySelector('a-scene').addEventListener('loaded', () => {
            loadingBar.style.width = '100%';
            setTimeout(() => {
                loadingScreen.classList.add('hidden');
            }, 500);
        });

        // ========== ACCESSORY SELECTION ==========
        const accessoryItems = document.querySelectorAll('.accessory-item');
        const categoryTabs = document.querySelectorAll('.category-tab');

        // Accessory visibility map
        const accessories = {
            glasses1: { entities: document.querySelectorAll('.glasses1-entity'), visible: true },
            glasses2: { entities: document.querySelectorAll('.glasses2-entity'), visible: false },
            hat1: { entities: document.querySelectorAll('.hat1-entity'), visible: false },
            hat2: { entities: document.querySelectorAll('.hat2-entity'), visible: false },
            earring: { entities: document.querySelectorAll('.earring-entity'), visible: false }
        };

        function updateVisibility() {
            Object.keys(accessories).forEach(key => {
                accessories[key].entities.forEach(entity => {
                    entity.setAttribute('visible', accessories[key].visible);
                });
            });
        }

        accessoryItems.forEach(item => {
            item.addEventListener('click', () => {
                const id = item.dataset.id;

                // Toggle this accessory
                accessories[id].visible = !accessories[id].visible;

                // Update UI
                if (accessories[id].visible) {
                    item.classList.add('selected');
                } else {
                    item.classList.remove('selected');
                }

                updateVisibility();
            });
        });

        // ========== CATEGORY FILTER ==========
        categoryTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                categoryTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                const category = tab.dataset.category;

                accessoryItems.forEach(item => {
                    if (category === 'all' || item.dataset.category === category) {
                        item.style.display = 'flex';
                    } else {
                        item.style.display = 'none';
                    }
                });
            });
        });

        // ========== CAPTURE PHOTO ==========
        const captureBtn = document.getElementById('captureBtn');
        const flash = document.getElementById('flash');
        const toast = document.getElementById('toast');

        captureBtn.addEventListener('click', () => {
            // Flash effect
            flash.classList.add('active');
            setTimeout(() => flash.classList.remove('active'), 100);

            // Capture canvas
            const canvas = document.querySelector('a-scene').components.screenshot.getCanvas('perspective');

            // Download
            const link = document.createElement('a');
            link.download = 'face-fun-photo.png';
            link.href = canvas.toDataURL('image/png');
            link.click();

            // Show toast
            toast.classList.add('visible');
            setTimeout(() => toast.classList.remove('visible'), 2000);
        });
    </script>
</body>

</html>
