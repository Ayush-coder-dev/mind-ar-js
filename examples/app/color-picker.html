<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Color Picker - AR Experience</title>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            touch-action: none;
            background: #000;
        }

        #video {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
        }

        #handCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 5;
        }

        .back-btn {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 16px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            backdrop-filter: blur(10px);
        }

        .ui-panel {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            padding: 16px 20px;
            border-radius: 16px;
            color: white;
            font-size: 13px;
            backdrop-filter: blur(10px);
            min-width: 160px;
        }

        .ui-title {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .color-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            transition: color 0.3s ease;
        }

        .color-index {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }

        .cube-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            perspective: 600px;
        }

        .cube {
            width: 150px;
            height: 150px;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateCube 8s infinite linear;
            transition: all 0.3s ease;
        }

        .cube.pulse {
            animation: rotateCube 8s infinite linear, pulseCube 0.3s ease;
        }

        @keyframes rotateCube {
            from {
                transform: rotateX(-20deg) rotateY(0deg);
            }

            to {
                transform: rotateX(-20deg) rotateY(360deg);
            }
        }

        @keyframes pulseCube {
            0% {
                transform: rotateX(-20deg) scale(1);
            }

            50% {
                transform: rotateX(-20deg) scale(1.15);
            }

            100% {
                transform: rotateX(-20deg) scale(1);
            }
        }

        .face {
            position: absolute;
            width: 150px;
            height: 150px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            transition: background 0.5s ease;
        }

        .front {
            transform: translateZ(75px);
        }

        .back {
            transform: rotateY(180deg) translateZ(75px);
        }

        .right {
            transform: rotateY(90deg) translateZ(75px);
        }

        .left {
            transform: rotateY(-90deg) translateZ(75px);
        }

        .top {
            transform: rotateX(90deg) translateZ(75px);
        }

        .bottom {
            transform: rotateX(-90deg) translateZ(75px);
        }

        .color-palette {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 30px;
            backdrop-filter: blur(10px);
        }

        .palette-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .palette-dot.active {
            border-color: white;
            transform: scale(1.3);
            box-shadow: 0 0 20px currentColor;
        }

        .instructions {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0, 0, 0, 0.85);
            padding: 12px 20px;
            border-radius: 14px;
            color: white;
            font-size: 13px;
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .instructions .highlight {
            color: #f472b6;
            font-weight: 600;
        }

        .hand-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(244, 114, 182, 0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 900;
            transform: translate(-50%, -50%);
            transition: all 0.1s ease;
        }

        .hand-cursor.pinching {
            background: rgba(244, 114, 182, 0.6);
            width: 35px;
            height: 35px;
            box-shadow: 0 0 30px rgba(244, 114, 182, 0.9);
            border-color: #f472b6;
        }

        .loading-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .loading-screen.hidden {
            display: none;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #f472b6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .color-burst {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            pointer-events: none;
            z-index: 8;
        }

        .color-burst.animate {
            animation: burst 0.5s ease-out;
        }

        @keyframes burst {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0.8;
            }

            100% {
                transform: translate(-50%, -50%) scale(3);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading Color Picker...</div>
    </div>

    <a href="./index.html" class="back-btn">← Back</a>

    <div class="ui-panel">
        <div class="ui-title">Current Color</div>
        <div class="color-name" id="colorName">Red</div>
        <div class="color-index" id="colorIndex">1 of 7</div>
    </div>

    <div class="cube-container">
        <div class="cube" id="cube">
            <div class="face front">🎨</div>
            <div class="face back">🌈</div>
            <div class="face right">✨</div>
            <div class="face left">🎭</div>
            <div class="face top">💎</div>
            <div class="face bottom">🔮</div>
        </div>
    </div>

    <div class="color-burst" id="colorBurst"></div>

    <div class="color-palette" id="colorPalette"></div>

    <div class="instructions">
        <span class="highlight">Pinky Pinch</span> (thumb + pinky) → Cycle through rainbow colors
    </div>

    <div class="hand-cursor" id="handCursor" style="display: none;"></div>

    <video id="video" autoplay playsinline></video>
    <canvas id="handCanvas"></canvas>

    <script>
        // Rainbow palette with beautiful gradients
        const RAINBOW_COLORS = [
            { name: 'Red', primary: '#ef4444', secondary: '#dc2626', gradient: 'linear-gradient(135deg, #ef4444, #dc2626)' },
            { name: 'Orange', primary: '#f97316', secondary: '#ea580c', gradient: 'linear-gradient(135deg, #f97316, #ea580c)' },
            { name: 'Yellow', primary: '#eab308', secondary: '#ca8a04', gradient: 'linear-gradient(135deg, #eab308, #ca8a04)' },
            { name: 'Green', primary: '#22c55e', secondary: '#16a34a', gradient: 'linear-gradient(135deg, #22c55e, #16a34a)' },
            { name: 'Cyan', primary: '#06b6d4', secondary: '#0891b2', gradient: 'linear-gradient(135deg, #06b6d4, #0891b2)' },
            { name: 'Blue', primary: '#3b82f6', secondary: '#2563eb', gradient: 'linear-gradient(135deg, #3b82f6, #2563eb)' },
            { name: 'Purple', primary: '#a855f7', secondary: '#9333ea', gradient: 'linear-gradient(135deg, #a855f7, #9333ea)' },
            { name: 'Pink', primary: '#ec4899', secondary: '#db2777', gradient: 'linear-gradient(135deg, #ec4899, #db2777)' },
            { name: 'Rose', primary: '#f43f5e', secondary: '#e11d48', gradient: 'linear-gradient(135deg, #f43f5e, #e11d48)' },
            { name: 'Indigo', primary: '#6366f1', secondary: '#4f46e5', gradient: 'linear-gradient(135deg, #6366f1, #4f46e5)' },
        ];

        const PINCH_THRESHOLD = 0.06;
        const PINCH_HOLD_FRAMES = 5;
        const COOLDOWN_FRAMES = 15;

        const video = document.getElementById('video');
        const handCanvas = document.getElementById('handCanvas');
        const loadingScreen = document.getElementById('loadingScreen');
        const cube = document.getElementById('cube');
        const colorName = document.getElementById('colorName');
        const colorIndex = document.getElementById('colorIndex');
        const handCursor = document.getElementById('handCursor');
        const colorPalette = document.getElementById('colorPalette');
        const colorBurst = document.getElementById('colorBurst');

        const handCtx = handCanvas.getContext('2d');

        let currentColorIndex = 0;
        let pinkyPinchFrames = 0;
        let cooldownCounter = 0;
        let isPinching = false;

        function resizeCanvas() {
            handCanvas.width = window.innerWidth;
            handCanvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Create palette dots
        function createPalette() {
            RAINBOW_COLORS.forEach((color, index) => {
                const dot = document.createElement('div');
                dot.className = 'palette-dot' + (index === 0 ? ' active' : '');
                dot.style.background = color.gradient;
                dot.style.color = color.primary;
                dot.dataset.index = index;
                dot.addEventListener('click', () => setColor(index));
                colorPalette.appendChild(dot);
            });
        }
        createPalette();

        // Apply color to cube
        function setColor(index) {
            currentColorIndex = index;
            const color = RAINBOW_COLORS[index];

            // Update cube faces
            const faces = cube.querySelectorAll('.face');
            faces.forEach(face => {
                face.style.background = color.gradient;
            });

            // Pulse animation
            cube.classList.remove('pulse');
            void cube.offsetWidth; // Trigger reflow
            cube.classList.add('pulse');

            // Update UI
            colorName.textContent = color.name;
            colorName.style.color = color.primary;
            colorIndex.textContent = `${index + 1} of ${RAINBOW_COLORS.length}`;

            // Update palette
            document.querySelectorAll('.palette-dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });

            // Color burst effect
            colorBurst.style.background = `radial-gradient(circle, ${color.primary} 0%, transparent 70%)`;
            colorBurst.classList.remove('animate');
            void colorBurst.offsetWidth;
            colorBurst.classList.add('animate');
        }

        // Cycle to next color
        function cycleColor() {
            const nextIndex = (currentColorIndex + 1) % RAINBOW_COLORS.length;
            setColor(nextIndex);
        }

        // Initialize first color
        setColor(0);

        // ========== HAND TRACKING ==========
        const hands = new Hands({
            locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
        });
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.75,
            minTrackingConfidence: 0.6
        });
        hands.onResults(onResults);

        function detectPinkyPinch(lm) {
            // Thumb tip (4) to Pinky tip (20)
            const dx = lm[4].x - lm[20].x;
            const dy = lm[4].y - lm[20].y;
            return Math.sqrt(dx * dx + dy * dy) < PINCH_THRESHOLD;
        }

        function onResults(results) {
            handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const lm = results.multiHandLandmarks[0];

                // Draw hand skeleton
                drawConnectors(handCtx, lm, HAND_CONNECTIONS, {
                    color: 'rgba(244, 114, 182, 0.4)',
                    lineWidth: 2
                });
                drawLandmarks(handCtx, lm, {
                    color: '#f472b6',
                    lineWidth: 1,
                    radius: 3
                });

                // Update cursor position (average of thumb and pinky)
                const handX = ((1 - lm[4].x) + (1 - lm[20].x)) / 2 * window.innerWidth;
                const handY = (lm[4].y + lm[20].y) / 2 * window.innerHeight;
                handCursor.style.display = 'block';
                handCursor.style.left = handX + 'px';
                handCursor.style.top = handY + 'px';

                // Handle cooldown
                if (cooldownCounter > 0) {
                    cooldownCounter--;
                    return;
                }

                const pinkyPinch = detectPinkyPinch(lm);

                if (pinkyPinch) {
                    pinkyPinchFrames++;
                    handCursor.classList.add('pinching');

                    if (pinkyPinchFrames >= PINCH_HOLD_FRAMES && !isPinching) {
                        isPinching = true;
                        cycleColor();
                        cooldownCounter = COOLDOWN_FRAMES;
                    }
                } else {
                    pinkyPinchFrames = 0;
                    isPinching = false;
                    handCursor.classList.remove('pinching');
                }
            } else {
                handCursor.style.display = 'none';
                pinkyPinchFrames = 0;
                isPinching = false;
            }
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: 1280, height: 720 }
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    const camera = new Camera(video, {
                        onFrame: async () => await hands.send({ image: video }),
                        width: 1280,
                        height: 720
                    });
                    camera.start();
                    setTimeout(() => {
                        loadingScreen.classList.add('hidden');
                    }, 1200);
                };
            } catch (e) {
                loadingScreen.querySelector('.loading-text').textContent = 'Camera access denied';
            }
        }

        startCamera();
    </script>
</body>

</html>
