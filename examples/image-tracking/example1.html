<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="../../src/image-target/aframe.js" type="module"></script>

  <style>
    /* ========== VIEWPORT FIX ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      touch-action: none;
    }

    /* ========== STATUS BAR ========== */
    #statusMsg {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 25px;
      z-index: 9999;
      font-size: 14px;
      font-family: 'Segoe UI', Arial, sans-serif;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .status-icon {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
      vertical-align: middle;
    }

    .status-icon.scanning {
      background: #ffc107;
      animation: pulse 1.5s infinite;
    }

    .status-icon.detected {
      background: #4caf50;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    /* ========== COLLAPSIBLE BOTTOM SHEET ========== */
    #infoPanel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-height: 60vh;
      background: linear-gradient(180deg, rgba(30, 30, 35, 0.95) 0%, rgba(20, 20, 25, 0.98) 100%);
      border-radius: 24px 24px 0 0;
      z-index: 10000;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    #infoPanel.minimized {
      transform: translateY(calc(100% - 80px));
    }

    #infoPanel.expanded {
      transform: translateY(0);
    }

    /* Drag Handle */
    .drag-handle {
      width: 40px;
      height: 5px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 3px;
      margin: 10px auto 6px;
      flex-shrink: 0;
      cursor: pointer;
    }

    /* Header - Always Visible */
    .panel-header {
      padding: 6px 20px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: bold;
      color: white;
      flex-shrink: 0;
    }

    .header-icon.hdd {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .header-icon.ssd {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }

    .header-text {
      flex: 1;
    }

    .header-text h2 {
      color: #ffffff;
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 2px 0;
    }

    .header-text .category {
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .expand-arrow {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.5);
      transition: transform 0.3s ease;
      font-size: 14px;
    }

    #infoPanel.expanded .expand-arrow {
      transform: rotate(180deg);
    }

    /* Scrollable Content */
    .panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px 24px;
      -webkit-overflow-scrolling: touch;
      max-height: calc(60vh - 90px);
    }

    .panel-content::-webkit-scrollbar {
      width: 4px;
    }

    .panel-content::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
    }

    /* Content Sections */
    .section {
      margin-bottom: 20px;
    }

    .section-title {
      color: #4fc3f7;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 8px;
    }

    .section p {
      color: rgba(255, 255, 255, 0.85);
      font-size: 14px;
      line-height: 1.6;
      margin: 0;
    }

    /* Specs Grid */
    .specs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .spec-item {
      background: rgba(255, 255, 255, 0.08);
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .spec-label {
      color: rgba(255, 255, 255, 0.5);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .spec-value {
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      margin-top: 2px;
    }

    /* Fun Fact Box */
    .fun-fact {
      background: linear-gradient(135deg, rgba(79, 195, 247, 0.15) 0%, rgba(129, 212, 250, 0.1) 100%);
      border-left: 3px solid #4fc3f7;
      padding: 12px 14px;
      border-radius: 0 10px 10px 0;
    }

    .fun-fact-label {
      color: #4fc3f7;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .fun-fact p {
      color: rgba(255, 255, 255, 0.9);
      font-size: 13px;
      line-height: 1.5;
    }

    /* ========== BACK BUTTON ========== */
    .back-btn {
      position: fixed;
      top: 12px;
      left: 16px;
      z-index: 10001;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
  </style>
</head>

<body>
  <!-- Back Button -->
  <a href="../app/index.html" class="back-btn">← Menu</a>

  <!-- Status Bar -->
  <div id="statusMsg"><span class="status-icon scanning"></span>Scanning...</div>

  <!-- Collapsible Info Panel -->
  <div id="infoPanel">
    <div class="drag-handle" id="dragHandle"></div>
    <div class="panel-header" id="panelHeader">
      <div class="header-icon" id="headerIcon">HDD</div>
      <div class="header-text">
        <h2 id="panelTitle">Loading...</h2>
        <div class="category" id="panelCategory">Storage Device</div>
      </div>
      <div class="expand-arrow" id="expandArrow">^</div>
    </div>
    <div class="panel-content">
      <div class="section">
        <div class="section-title">Overview</div>
        <p id="panelDescription">Loading description...</p>
      </div>

      <div class="section">
        <div class="section-title">Specifications</div>
        <div class="specs-grid" id="specsGrid"></div>
      </div>

      <div class="section">
        <div class="section-title">How It Works</div>
        <p id="panelHowItWorks">Loading...</p>
      </div>

      <div class="section">
        <div class="fun-fact">
          <div class="fun-fact-label">Did You Know?</div>
          <p id="panelFunFact">Loading fun fact...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- AR Scene with STABILIZED models (filterMinCF + filterBeta) -->
  <a-scene mindar-image="imageTargetSrc: ./assets/targets.mind; filterMinCF: 0.001; filterBeta: 10;" embedded
    renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <a-assets>
      <a-asset-item id="model1" src="./assets/model1.glb"></a-asset-item>
      <a-asset-item id="model2" src="./assets/model2.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Image 1: HDD -->
    <a-entity mindar-image-target="targetIndex: 0" id="target0">
      <a-gltf-model src="#model1" position="0 0 0.1" scale="1 1 1"></a-gltf-model>
    </a-entity>

    <!-- Image 2: SSD -->
    <a-entity mindar-image-target="targetIndex: 1" id="target1">
      <a-gltf-model src="#model2" position="0 0 0.1" scale="1 1 1"></a-gltf-model>
    </a-entity>
  </a-scene>

  <script>
    // ========== OBJECT DATA (Wiki-like Info) ==========
    const objectData = {
      hdd: {
        iconClass: "hdd",
        iconText: "HDD",
        title: "Hard Disk Drive (HDD)",
        category: "Magnetic Storage Device",
        description: "A Hard Disk Drive is a non-volatile data storage device that uses magnetic storage to store and retrieve digital data. It consists of one or more rigid rapidly rotating platters coated with magnetic material, with magnetic heads arranged on a moving actuator arm to read and write data.",
        specs: [
          { label: "Capacity", value: "500GB - 20TB" },
          { label: "Speed", value: "5400-7200 RPM" },
          { label: "Interface", value: "SATA III" },
          { label: "Latency", value: "5-10 ms" },
          { label: "Read Speed", value: "80-160 MB/s" },
          { label: "Lifespan", value: "3-5 Years" }
        ],
        howItWorks: "Data is written by magnetizing tiny regions on the spinning platters. The read/write head floats just nanometers above the surface on a cushion of air. When reading, the head detects changes in magnetization and converts them back into electrical signals that represent your data.",
        funFact: "The read/write head in an HDD floats only 3 nanometers above the platter surface - that's 25,000 times thinner than a human hair! If the platter were scaled up to the size of a football field, the head would fly just 1 millimeter above it."
      },
      ssd: {
        iconClass: "ssd",
        iconText: "SSD",
        title: "Solid State Drive (SSD)",
        category: "Flash Storage Device",
        description: "A Solid State Drive is a storage device that uses integrated circuit assemblies to store data persistently, typically using flash memory. Unlike HDDs, SSDs have no moving mechanical parts, making them faster, more durable, and energy-efficient.",
        specs: [
          { label: "Capacity", value: "128GB - 8TB" },
          { label: "Read Speed", value: "Up to 7000 MB/s" },
          { label: "Interface", value: "NVMe / SATA" },
          { label: "Latency", value: "0.1 ms" },
          { label: "Write Speed", value: "Up to 5000 MB/s" },
          { label: "Lifespan", value: "5-10 Years" }
        ],
        howItWorks: "SSDs store data in floating-gate transistors organized into cells. Each cell can hold one or more bits by trapping electrons. When you save a file, electrical charges are deposited into these cells. Reading data involves measuring the charge level in each cell to determine the stored bits.",
        funFact: "An NVMe SSD can transfer the entire contents of a DVD (4.7GB) in less than 1 second! Modern SSDs are so fast that they're often limited by other system components rather than the drive itself."
      }
    };

    // ========== DOM ELEMENTS ==========
    const statusMsg = document.getElementById("statusMsg");
    const infoPanel = document.getElementById("infoPanel");
    const headerIcon = document.getElementById("headerIcon");
    const panelTitle = document.getElementById("panelTitle");
    const panelCategory = document.getElementById("panelCategory");
    const panelDescription = document.getElementById("panelDescription");
    const specsGrid = document.getElementById("specsGrid");
    const panelHowItWorks = document.getElementById("panelHowItWorks");
    const panelFunFact = document.getElementById("panelFunFact");
    const panelHeader = document.getElementById("panelHeader");
    const dragHandle = document.getElementById("dragHandle");

    const target0 = document.getElementById("target0");
    const target1 = document.getElementById("target1");

    let isPanelExpanded = false;

    // ========== PANEL FUNCTIONS ==========
    function showPanel(data) {
      headerIcon.className = "header-icon " + data.iconClass;
      headerIcon.textContent = data.iconText;
      panelTitle.textContent = data.title;
      panelCategory.textContent = data.category;
      panelDescription.textContent = data.description;
      panelHowItWorks.textContent = data.howItWorks;
      panelFunFact.textContent = data.funFact;

      // Build specs grid
      specsGrid.innerHTML = data.specs.map(spec => `
          <div class="spec-item">
            <div class="spec-label">${spec.label}</div>
            <div class="spec-value">${spec.value}</div>
          </div>
        `).join('');

      // Show minimized first (only header visible)
      infoPanel.classList.remove("expanded");
      infoPanel.classList.add("minimized");
      isPanelExpanded = false;
    }

    function hidePanel() {
      infoPanel.classList.remove("minimized", "expanded");
      isPanelExpanded = false;
    }

    function togglePanel() {
      if (isPanelExpanded) {
        infoPanel.classList.remove("expanded");
        infoPanel.classList.add("minimized");
        isPanelExpanded = false;
      } else {
        infoPanel.classList.remove("minimized");
        infoPanel.classList.add("expanded");
        isPanelExpanded = true;
      }
    }

    // Click header or drag handle to expand/collapse
    panelHeader.addEventListener("click", togglePanel);
    dragHandle.addEventListener("click", togglePanel);

    // ========== EVENT LISTENERS ==========
    target0.addEventListener("targetFound", () => {
      statusMsg.innerHTML = '<span class="status-icon detected"></span>HDD Detected';
      showPanel(objectData.hdd);
    });

    target0.addEventListener("targetLost", () => {
      statusMsg.innerHTML = '<span class="status-icon scanning"></span>Scanning...';
      hidePanel();
    });

    target1.addEventListener("targetFound", () => {
      statusMsg.innerHTML = '<span class="status-icon detected"></span>SSD Detected';
      showPanel(objectData.ssd);
    });

    target1.addEventListener("targetLost", () => {
      statusMsg.innerHTML = '<span class="status-icon scanning"></span>Scanning...';
      hidePanel();
    });

    // Prevent zoom on double-tap
    document.addEventListener('dblclick', (e) => e.preventDefault());
  </script>
</body>

</html>
